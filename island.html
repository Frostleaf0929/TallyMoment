<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾刻 · 原子岛</title>
    <style>
      /* 原子岛独立轻量页：无任何框架，毫秒级加载（终末地风格） */
      :root {
        color-scheme: dark;
        font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; overflow: hidden; }
      body {
        height: 100vh;
        background: #0f1013;
        color: #e6e4dc;
        user-select: none;
        -webkit-user-select: none;
      }
      .island { height: 100vh; display: flex; flex-direction: column; }

      /* 胶囊条：斜切角 + 琥珀黄细节 */
      .bar {
        flex: none;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px 0 16px;
        clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
        background: linear-gradient(135deg, #17181d, #101114);
        box-shadow: inset 0 0 0 1px rgba(232, 179, 75, 0.22);
        cursor: default;
        min-width: 0;
      }
      .mark {
        flex: none;
        width: 10px;
        height: 10px;
        background: #e8b34b;
        transform: rotate(45deg);
        box-shadow: 0 0 8px rgba(232, 179, 75, 0.5);
      }
      #bar-mods {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mod {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mod.focus { flex: none; max-width: 34%; font-weight: 600; }
      .mod.focus.off { color: #8b8a82; }
      .mod.next { flex: 1; min-width: 0; color: #cfcdc4; font-size: 12px; }
      .mod.done { flex: none; font-size: 11.5px; color: #8b8a82; }
      .mod.clock { flex: none; font-size: 13px; }
      .tag {
        flex: none;
        margin-right: 4px;
        padding: 0 6px;
        font-size: 10px;
        color: #e8b34b;
        border: 1px solid rgba(232, 179, 75, 0.4);
        line-height: 1.5;
      }
      .num { font-variant-numeric: tabular-nums; color: #e8b34b; font-weight: 700; }
      .div { flex: none; width: 1px; height: 18px; background: rgba(232, 179, 75, 0.28); }

      .tg {
        flex: none;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 4px;
        background: rgba(232, 179, 75, 0.14);
        color: #e8b34b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }
      .tg:hover { background: rgba(232, 179, 75, 0.25); }
      .tg svg { transition: transform 0.18s ease; }
      .tg.flip svg { transform: rotate(180deg); }

      /* 展开区：待办 */
      #tasks-wrap { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 12px; }
      .thead { margin: 6px 0 4px; font-size: 10.5px; letter-spacing: 0.18em; color: #8b8a82; }
      .trow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 4px;
        border-bottom: 1px solid rgba(232, 179, 75, 0.12);
      }
      .ring {
        flex: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid rgba(232, 179, 75, 0.55);
        background: transparent;
        cursor: pointer;
        padding: 0;
      }
      .ring:hover { background: rgba(232, 179, 75, 0.25); }
      .tname {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tdue { flex: none; font-size: 11.5px; font-weight: 600; }
      .tempty { margin: 8px 0 0; font-size: 12px; color: #8b8a82; }
      .tfoot { margin-top: 10px; display: flex; justify-content: flex-end; }
      .setbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(232, 179, 75, 0.4);
        background: transparent;
        color: #e8b34b;
        border-radius: 4px;
        font-size: 11.5px;
        font-family: inherit;
        padding: 5px 12px;
        cursor: pointer;
      }
      .setbtn:hover { background: rgba(232, 179, 75, 0.12); }
    </style>
  </head>

  <body>
    <div class="island">
      <div class="bar" data-tauri-drag-region>
        <span class="mark" data-tauri-drag-region></span>
        <div id="bar-mods" data-tauri-drag-region></div>
        <button id="tg" class="tg" title="展开待办">
          <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <div id="tasks-wrap" style="display: none">
        <div id="tasks"></div>
        <div class="tfoot">
          <button id="setbtn" class="setbtn">
            <svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            打开设置
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/island.ts"></script>
  </body>
</html>
