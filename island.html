<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>原子岛</title>
<style>
  /* 终末地充电 HUD 风（参照 zmd-charge）：深底圆胶囊 / 电标圆环 / 徽章 / 大号数字 / 呼吸光晕 */
  :root {
    --bg: #0b0d10;
    --ink: #eef1e9;
    --ink-dim: #9aa3ad;
    --acc: #b8e34b;            /* 终末地超充黄绿 */
    --acc-line: rgba(184, 227, 75, 0.45);
    --line: rgba(255, 255, 255, 0.08);
    --danger: #ff4d4f;
    /* 方案 A：窗口固定 392x324（顶边=屏幕顶），胶囊是窗口内元素，四态形变全靠 CSS */
    --island-w: 392px;
    --idle-w: 240px;           /* idle/snap 态胶囊宽（后端 idle_width 设置写入） */
    --reveal: 8px;             /* 吸附态露出高度（后端 snap_reveal 设置写入） */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--ink); }
  #root { width: 100%; height: 100%; padding-top: 8px; display: flex; flex-direction: column; align-items: stretch; }

  /* 胶囊壳（顶部条）：四态形变全在这一个元素上，宽/高/位移补间由浏览器合成器逐帧完成。
     不用 box-shadow：窗口被 SetWindowRgn 裁成胶囊区域，区域外的阴影会被切掉，
     过渡期（并集区域）还可能露出底色；描边已足够分层感 */
  #bar {
    flex: none;
    position: relative;
    display: flex; align-items: center; gap: 12px;
    width: var(--island-w); align-self: center; overflow: hidden;
    height: 56px; padding: 0 14px 0 8px;
    /* 透明度可调（--pill-a 由 island.ts 按"个性化→透明度"写入，1=不透明） */
    background: rgba(13, 15, 20, var(--pill-a, 1));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px;
    cursor: default;
    transition: width .18s cubic-bezier(.2,.9,.25,1.15), height .22s cubic-bezier(.2,.9,.25,1.2),
                transform .24s cubic-bezier(.2,.9,.25,1.2), padding .22s ease, opacity .2s ease;
  }
  /* 终末地 HUD 四角 L 形角标（左上 + 右下） */
  #bar::before, #bar::after {
    content: ""; position: absolute; width: 12px; height: 10px; pointer-events: none;
    border: 0 solid var(--acc-line); opacity: 0.85;
  }
  #bar::before { left: 13px; top: 8px; border-left-width: 2px; border-top-width: 2px; border-top-left-radius: 6px; }
  #bar::after { right: 13px; bottom: 8px; border-right-width: 2px; border-bottom-width: 2px; border-bottom-right-radius: 6px; }

  /* 材质改版：透明度统一由 --pill-a 控制（个性化里调节），不再区分材质档 */

  /* 电标圆环（标志） */
  .mark { flex: none; position: relative; width: 36px; height: 36px; display: grid; place-items: center; }
  .mark > svg { width: 36px; height: 36px; transform: rotate(-90deg); }
  .mark .ring-bg { stroke: rgba(255,255,255,0.10); }
  .mark .ring-fg { stroke: var(--acc); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .mark .bolt { position: absolute; inset: 0; display: grid; place-items: center; }
  .mark .bolt svg { width: 15px; height: 15px; fill: var(--acc); }
  body.paused .mark .ring-fg { stroke: var(--ink-dim); }
  body.paused .mark .bolt svg { fill: var(--ink-dim); }

  /* 专注时电标呼吸光晕（波纹感） */
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184,227,75,0.30); }
    50% { box-shadow: 0 0 0 6px rgba(184,227,75,0); }
  }
  body.focusing .mark { border-radius: 50%; animation: pulse 2.2s ease-out infinite; }

  /* 主内容区：横排单元（终末地 HUD 单行式：徽章上、数值下） */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: row; align-items: center; gap: 14px; overflow: hidden; }
  .unit { display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; flex-shrink: 1; }
  .urow { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .badge {
    flex: none; align-self: flex-start; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--acc); border: 1px solid var(--acc-line); border-radius: 4px;
    padding: 0 5px; line-height: 1.5; text-transform: uppercase;
  }
  body.paused .badge { color: var(--ink-dim); border-color: rgba(255,255,255,0.2); }
  .mod-name {
    font-size: 11px; color: var(--ink-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
  }
  .mod-num {
    font-size: 18px; font-weight: 700; line-height: 1.1;
    font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .mod-num small { font-size: 10px; font-weight: 600; color: var(--ink-dim); margin-left: 2px; }
  .mod-num.acc { color: var(--acc); }
  .vsep { flex: none; width: 1px; height: 24px; background: var(--line); }

  /* 右侧：今日完成 / 时钟 */
  #side { flex: none; display: flex; align-items: center; gap: 10px; }
  .side-item { display: flex; align-items: baseline; gap: 4px; }
  .side-item .n { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .side-item .n.done { color: var(--acc); }
  .side-item .l { font-size: 9px; color: var(--ink-dim); letter-spacing: 1px; }
  #clock { font-size: 13px; font-weight: 600; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .divider { width: 1px; height: 22px; background: var(--line); }

  /* expanded 展开区：始终渲染，随状态淡入 */
  #panel {
    display: flex; flex: 1; min-height: 0; margin-top: 8px;
    background: rgba(13, 15, 20, var(--pill-a, 1));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    padding: 12px 14px;
    flex-direction: column; gap: 8px;
    opacity: 0; transform: translateY(-8px);
    transition: opacity .2s ease .06s, transform .2s ease .06s;
    pointer-events: none;
    overflow: hidden;
  }
  body.expanded #panel { opacity: 1; transform: none; pointer-events: auto; }
  .panel-title {
    font-size: 9px; font-weight: 700; letter-spacing: 2px; color: var(--ink-dim);
    display: flex; align-items: center; gap: 8px; text-transform: uppercase;
  }
  .panel-title::before { content: ""; width: 5px; height: 5px; background: var(--acc); }
  #next-name { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next-name .t { color: var(--acc); font-weight: 700; margin-left: 6px; font-variant-numeric: tabular-nums; }

  #tasks { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  #tasks::-webkit-scrollbar { width: 3px; }
  #tasks::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  .task-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 4px; border-bottom: 1px solid var(--line);
    cursor: pointer; border-radius: 6px;
  }
  .task-row:hover { background: rgba(255,255,255,0.04); }
  .task-row .sq { flex: none; width: 7px; height: 7px; background: var(--acc); }
  .task-row .nm { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-row .due { flex: none; font-size: 10px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .task-row .due.over { color: var(--danger); }
  .empty { font-size: 11px; color: var(--ink-dim); padding: 8px 4px; }

  #setbtn {
    flex: none; align-self: flex-end;
    font-size: 10px; letter-spacing: 1px; color: var(--ink-dim);
    background: none; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
    padding: 3px 10px; cursor: pointer;
  }
  #setbtn:hover { color: var(--acc); border-color: var(--acc-line); }

  /* idle 缩小态 / snap 吸附态：无悬停时只留核心（WinIsland 式） */
  #idle-main { display: none; flex: 1; min-width: 0; align-items: baseline; gap: 6px; }
  #idle-core { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #idle-core .l { font-size: 9px; font-weight: 600; color: var(--ink-dim); letter-spacing: 1px; margin-right: 3px; }
  #idle-done { flex: none; font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  #idle-done b { color: var(--acc); font-weight: 700; }

  body.idle #bar, body.snap #bar { width: var(--idle-w); height: 40px; padding: 0 12px 0 6px; opacity: 0.92; }
  body.idle #bar::before, body.idle #bar::after,
  body.snap #bar::before, body.snap #bar::after { opacity: 0; }
  body.idle .mark, body.snap .mark { width: 28px; height: 28px; }
  body.idle .mark > svg, body.snap .mark > svg { width: 28px; height: 28px; }
  body.idle .mark .bolt svg, body.snap .mark .bolt svg { width: 11px; height: 11px; }
  body.idle #main, body.snap #main { display: none; }
  body.idle #idle-main, body.snap #idle-main { display: flex; }
  body.idle #side .side-item.done-item, body.snap #side .side-item.done-item { display: none; }
  body.idle #clock, body.snap #clock { display: none; }
  /* 位置模式对齐 idle/snap 胶囊（与后端命中矩形同式） */
  body.pos-left #bar { align-self: flex-start; }
  body.pos-right #bar { align-self: flex-end; }
  /* snap 四向：滑出只露 reveal 像素（贴哪条边由后端判定，经 island-snap 事件回填 snap-<边> 类） */
  body.snap-top #bar { transform: translateY(calc(var(--reveal) - 48px)); }
  body.snap-bottom #bar { transform: translateY(calc(56px - var(--reveal))); }
  body.snap-left #bar { align-self: flex-start; transform: translateX(calc(var(--reveal) - var(--idle-w))); }
  body.snap-right #bar { align-self: flex-end; transform: translateX(calc(var(--idle-w) - var(--reveal))); }
  /* 入场：窗口显示后从屏幕上方滑入（只播一次，boot 类由 island.ts 在首帧后移除） */
  body.boot #bar { transform: translateY(-64px); opacity: 0; }
</style>
</head>
<body class="normal boot">
  <div id="root">
    <div id="bar" title="点击展开 · 按住拖动">
      <div class="mark">
        <svg viewBox="0 0 36 36">
          <circle class="ring-bg" cx="18" cy="18" r="15" fill="none" stroke-width="3"/>
          <circle class="ring-fg" cx="18" cy="18" r="15" fill="none" stroke-width="3"
                  stroke-dasharray="94.2" stroke-dashoffset="94.2"/>
        </svg>
        <div class="bolt">
          <svg viewBox="0 0 24 24"><path d="M13 2 5 14h5l-2 8 9-12h-5l1-8z"/></svg>
        </div>
      </div>
      <div id="idle-main">
        <span id="idle-core"></span>
        <span id="idle-done"></span>
      </div>
      <div id="main"></div>
      <div id="side">
        <div class="side-item done-item"><span class="n done" id="done-n">0</span><span class="l">DONE</span></div>
        <div class="divider"></div>
        <span id="clock">--:--</span>
      </div>
    </div>
    <div id="panel">
      <div class="panel-title">NEXT · 下个任务</div>
      <div id="next-name"></div>
      <div class="panel-title">TASKS · 待办</div>
      <div id="tasks"></div>
      <button id="setbtn">⚙ 设置</button>
    </div>
  </div>
  <script type="module" src="/src/island.ts"></script>
</body>
</html>
