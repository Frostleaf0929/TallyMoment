<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>原子岛</title>
<style>
  /* 终末地充电 HUD 风（参照 zmd-charge）：深底圆胶囊 / 电标圆环 / 徽章 / 大号数字 / 呼吸光晕 */
  :root {
    --bg: #0b0d10;
    --ink: #eef1e9;
    --ink-dim: #9aa3ad;
    --acc: #b8e34b;            /* 终末地超充黄绿 */
    --acc-line: rgba(184, 227, 75, 0.45);
    --line: rgba(255, 255, 255, 0.08);
    --danger: #ff4d4f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--ink); }
  #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: stretch; }

  /* 胶囊壳（顶部条） */
  #bar {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    height: 56px; padding: 0 14px 0 8px;
    background: linear-gradient(180deg, #10131a 0%, var(--bg) 100%);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    cursor: default;
    transition: height .22s cubic-bezier(.2,.9,.25,1.2), padding .22s ease, opacity .2s ease;
  }

  /* 电标圆环（标志） */
  .mark { flex: none; position: relative; width: 36px; height: 36px; display: grid; place-items: center; }
  .mark > svg { width: 36px; height: 36px; transform: rotate(-90deg); }
  .mark .ring-bg { stroke: rgba(255,255,255,0.10); }
  .mark .ring-fg { stroke: var(--acc); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .mark .bolt { position: absolute; inset: 0; display: grid; place-items: center; }
  .mark .bolt svg { width: 15px; height: 15px; fill: var(--acc); }
  body.paused .mark .ring-fg { stroke: var(--ink-dim); }
  body.paused .mark .bolt svg { fill: var(--ink-dim); }

  /* 专注时电标呼吸光晕（波纹感） */
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184,227,75,0.30); }
    50% { box-shadow: 0 0 0 6px rgba(184,227,75,0); }
  }
  body.focusing .mark { border-radius: 50%; animation: pulse 2.2s ease-out infinite; }

  /* 主内容区 */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .badge-row { display: flex; align-items: center; gap: 6px; }
  .badge {
    flex: none; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--acc); border: 1px solid var(--acc-line); border-radius: 4px;
    padding: 1px 5px; line-height: 1.4; text-transform: uppercase;
  }
  body.paused .badge { color: var(--ink-dim); border-color: rgba(255,255,255,0.2); }
  .mod-name {
    font-size: 11px; color: var(--ink-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mod-num {
    font-size: 20px; font-weight: 700; line-height: 1.05;
    font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
  }
  .mod-num small { font-size: 11px; font-weight: 600; color: var(--ink-dim); margin-left: 2px; }
  .mod-num.acc { color: var(--acc); }

  /* 右侧：今日完成 / 时钟 */
  #side { flex: none; display: flex; align-items: center; gap: 10px; }
  .side-item { display: flex; align-items: baseline; gap: 4px; }
  .side-item .n { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .side-item .n.done { color: var(--acc); }
  .side-item .l { font-size: 9px; color: var(--ink-dim); letter-spacing: 1px; }
  #clock { font-size: 13px; font-weight: 600; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .divider { width: 1px; height: 22px; background: var(--line); }

  /* expanded 展开区 */
  #panel {
    display: none; flex: 1; min-height: 0; margin-top: 8px;
    background: linear-gradient(180deg, #10131a 0%, var(--bg) 100%);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.55);
    padding: 12px 14px;
    flex-direction: column; gap: 8px;
  }
  body.expanded #panel { display: flex; }
  .panel-title {
    font-size: 9px; font-weight: 700; letter-spacing: 2px; color: var(--ink-dim);
    display: flex; align-items: center; gap: 8px; text-transform: uppercase;
  }
  .panel-title::before { content: ""; width: 5px; height: 5px; background: var(--acc); }
  #next-name { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next-name .t { color: var(--acc); font-weight: 700; margin-left: 6px; font-variant-numeric: tabular-nums; }

  #tasks { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  #tasks::-webkit-scrollbar { width: 3px; }
  #tasks::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  .task-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 4px; border-bottom: 1px solid var(--line);
    cursor: pointer; border-radius: 6px;
  }
  .task-row:hover { background: rgba(255,255,255,0.04); }
  .task-row .sq { flex: none; width: 7px; height: 7px; background: var(--acc); }
  .task-row .nm { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-row .due { flex: none; font-size: 10px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .task-row .due.over { color: var(--danger); }
  .empty { font-size: 11px; color: var(--ink-dim); padding: 8px 4px; }

  #setbtn {
    flex: none; align-self: flex-end;
    font-size: 10px; letter-spacing: 1px; color: var(--ink-dim);
    background: none; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
    padding: 3px 10px; cursor: pointer;
  }
  #setbtn:hover { color: var(--acc); border-color: var(--acc-line); }

  /* idle 缩小态：无悬停时只留核心（WinIsland 式） */
  #idle-main { display: none; flex: 1; min-width: 0; align-items: baseline; gap: 6px; }
  #idle-core { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #idle-core .l { font-size: 9px; font-weight: 600; color: var(--ink-dim); letter-spacing: 1px; margin-right: 3px; }
  #idle-done { flex: none; font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  #idle-done b { color: var(--acc); font-weight: 700; }

  body.idle #bar { height: 40px; padding: 0 12px 0 6px; opacity: 0.92; }
  body.idle .mark { width: 28px; height: 28px; }
  body.idle .mark > svg { width: 28px; height: 28px; }
  body.idle .mark .bolt svg { width: 11px; height: 11px; }
  body.idle #main { display: none; }
  body.idle #idle-main { display: flex; }
  body.idle #side .side-item.done-item { display: none; }
  body.idle #clock { display: none; }
</style>
</head>
<body class="normal">
  <div id="root">
    <div id="bar" title="点击展开 · 按住拖动">
      <div class="mark">
        <svg viewBox="0 0 36 36">
          <circle class="ring-bg" cx="18" cy="18" r="15" fill="none" stroke-width="3"/>
          <circle class="ring-fg" cx="18" cy="18" r="15" fill="none" stroke-width="3"
                  stroke-dasharray="94.2" stroke-dashoffset="94.2"/>
        </svg>
        <div class="bolt">
          <svg viewBox="0 0 24 24"><path d="M13 2 5 14h5l-2 8 9-12h-5l1-8z"/></svg>
        </div>
      </div>
      <div id="idle-main">
        <span id="idle-core"></span>
        <span id="idle-done"></span>
      </div>
      <div id="main"></div>
      <div id="side">
        <div class="side-item done-item"><span class="n done" id="done-n">0</span><span class="l">DONE</span></div>
        <div class="divider"></div>
        <span id="clock">--:--</span>
      </div>
    </div>
    <div id="panel">
      <div class="panel-title">NEXT · 下个任务</div>
      <div id="next-name"></div>
      <div class="panel-title">TASKS · 待办</div>
      <div id="tasks"></div>
      <button id="setbtn">⚙ 设置</button>
    </div>
  </div>
  <script type="module" src="/src/island.ts"></script>
</body>
</html>
